{% extends "base.html" %} {% block title %}Реєстрація — SmartTask{% endblock %}
{% block auth_content %}

<div class="auth-card">
  <div class="brand text-dark mb-4">
    <span class="brand-icon">S</span>
    SmartTask
  </div>

  <h1>Створення акаунта</h1>

  <p class="auth-subtitle">Почніть організовувати свої завдання.</p>

  <div id="authAlert"></div>

  <form id="registerForm">
    <div class="mb-3">
      <label class="form-label">Ім'я користувача</label>
      <input
        type="text"
        name="username"
        class="form-control"
        minlength="3"
        maxlength="50"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required />
    </div>

    <div class="mb-4">
      <label class="form-label">Пароль</label>
      <input
        type="password"
        name="password"
        class="form-control"
        minlength="8"
        maxlength="128"
        required
      />
    </div>

    <button type="submit" class="primary-button w-100">Зареєструватися</button>
  </form>

  <p class="text-center mt-4 mb-0">
    Вже маєте акаунт?
    <a href="{{ url_for('pages.login_page') }}"> Увійти </a>
  </p>
</div>

{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
